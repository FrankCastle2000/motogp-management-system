<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MotoGP 车手信息</title>
  <link rel="icon" type="image/jpeg" href="/assets/images/site-icon.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/common.css" />
</head>
<body>
  <div class="wrap riders-wrap">
    <header class="page-header">
      <div>
        <h1>MotoGP <span>车手</span></h1>
        <p id="page-desc">登录后可查看车手信息</p>
      </div>
      <div class="user-bar">
        <nav class="nav-links">
          <a href="/standings.html">车手积分</a>
          <a href="/calendar.html">赛程日历</a>
          <a href="/riders.html" class="active">车手信息</a>
          <a href="/teams.html">车队信息</a>
          <a href="/change-password.html">修改密码</a>
          <a href="/users.html" id="users-link" hidden>账号管理</a>
          <a href="/logs.html" id="logs-link" hidden>操作日志</a>
        </nav>
        <span id="user-label">加载中…</span>
        <span class="role-tag" id="role-tag"></span>
        <button type="button" class="btn-ghost" id="logout-btn">退出</button>
      </div>
    </header>

    <dialog class="modal" id="rider-modal">
      <div class="modal-header">
        <h2 id="form-title">新增车手</h2>
        <button type="button" class="modal-close" id="modal-close-btn" aria-label="关闭">×</button>
      </div>
      <form id="rider-form">
        <input type="hidden" id="rider-id" />
        <input type="hidden" id="rider-version" />
        <div class="form-grid-4">
          <div class="field">
            <label for="rider-number">车手编号</label>
            <input id="rider-number" maxlength="16" required placeholder="63" />
          </div>
          <div class="field">
            <label for="english-name">英文名</label>
            <input id="english-name" maxlength="128" required placeholder="Francesco Bagnaia" />
          </div>
          <div class="field">
            <label for="chinese-name">中文名</label>
            <input id="chinese-name" maxlength="64" required placeholder="弗朗切斯科·巴格尼亚" />
          </div>
          <div class="field">
            <label for="nickname">昵称</label>
            <input id="nickname" maxlength="64" placeholder="Pecco" />
          </div>
          <div class="field">
            <label for="nationality">国籍</label>
            <input id="nationality" maxlength="64" required placeholder="意大利" />
          </div>
          <div class="field">
            <label for="team-id">所属车队</label>
            <select id="team-id">
              <option value="">未分配</option>
            </select>
          </div>
          <div class="field">
            <label for="bike">驾驶车辆</label>
            <input id="bike" maxlength="128" required placeholder="Ducati Desmosedici GP24" />
          </div>
          <div class="field">
            <label for="birth-date">出生日期</label>
            <input id="birth-date" type="date" required />
          </div>
          <div class="field">
            <label for="birth-place">出生地点</label>
            <input id="birth-place" maxlength="128" required placeholder="都灵，意大利" />
          </div>
        </div>
        <div class="actions">
          <button type="submit" class="btn-primary" id="submit-btn" style="width: auto">添加</button>
          <button type="button" class="btn-ghost" id="cancel-btn">取消</button>
          <button type="button" class="btn-clear-draft" id="clear-draft-btn">清空草稿</button>
        </div>
        <div class="toast" id="toast"></div>
        <div class="draft-hint" id="draft-hint">新增内容会自动保存为本地草稿</div>
      </form>
    </dialog>

    <section class="panel rider-list-panel">
      <div class="panel-heading">
        <h2>车手总览</h2>
        <button type="button" class="btn-primary btn-add" id="add-rider-btn" hidden>新增车手</button>
      </div>
      <form class="filter-bar rider-filter-bar" id="rider-filter-form">
        <input id="filter-rider-number" placeholder="车手编号" aria-label="按车手编号搜索" />
        <input id="filter-rider-name" placeholder="英文名、中文名或昵称" aria-label="按姓名搜索" />
        <input id="filter-nationality" placeholder="国籍" aria-label="按国籍搜索" />
        <select id="filter-team-id" aria-label="按车队筛选"><option value="">全部车队</option></select>
        <div class="filter-actions" style="display:grid;grid-template-columns:72px 72px;gap:8px;flex:0 0 152px">
          <button type="submit" class="btn-primary" style="width:72px">搜索</button>
          <button type="button" class="btn-ghost" id="reset-filter-btn" style="width:72px">重置</button>
        </div>
      </form>
      <div class="table-wrap rider-table-wrap">
        <table class="rider-table">
          <thead>
            <tr>
              <th>
                <button type="button" class="sort-button active" data-sort-key="rider_number">
                  车手编号 <span class="sort-indicator" aria-hidden="true">↑</span>
                </button>
              </th>
              <th>英文名</th>
              <th>中文名</th>
              <th>昵称</th>
              <th>国籍</th>
              <th>所属车队</th>
              <th>驾驶车辆</th>
              <th>
                <button type="button" class="sort-button" data-sort-key="birth_date">
                  出生日期 <span class="sort-indicator" aria-hidden="true">↕</span>
                </button>
              </th>
              <th>出生地点</th>
              <th id="ops-th">操作</th>
            </tr>
          </thead>
          <tbody id="rider-tbody">
            <tr>
              <td colspan="10" class="empty">加载中...</td>
            </tr>
          </tbody>
        </table>
      </div>
      <div class="toast" id="list-toast"></div>
    </section>
  </div>

  <script src="/assets/js/api.js"></script>
  <script>
    const API = "/api/riders";
    const RIDER_DRAFT_KEY = "motogp:rider:create-draft:v1";
    let currentUser = null;
    let isAdmin = false;
    let teams = [];
    let ridersById = new Map();
    let currentRiders = [];
    let sortKey = "rider_number";
    let sortDirection = "asc";
    let draftSaveTimer = null;
    const riderNumberCollator = new Intl.Collator("zh-CN", {
      numeric: true,
      sensitivity: "base",
    });

    const modal = document.getElementById("rider-modal");
    const addBtn = document.getElementById("add-rider-btn");
    const modalCloseBtn = document.getElementById("modal-close-btn");
    const form = document.getElementById("rider-form");
    const formTitle = document.getElementById("form-title");
    const riderIdInput = document.getElementById("rider-id");
    const riderVersionInput = document.getElementById("rider-version");
    const teamSelect = document.getElementById("team-id");
    const filterTeamSelect = document.getElementById("filter-team-id");
    const submitBtn = document.getElementById("submit-btn");
    const cancelBtn = document.getElementById("cancel-btn");
    const clearDraftBtn = document.getElementById("clear-draft-btn");
    const toast = document.getElementById("toast");
    const draftHint = document.getElementById("draft-hint");
    const listToast = document.getElementById("list-toast");
    const tbody = document.getElementById("rider-tbody");
    const opsTh = document.getElementById("ops-th");

    function showToast(el, message, isError = false) {
      el.textContent = message;
      el.classList.toggle("error", isError);
    }

    function colSpan() {
      return isAdmin ? 10 : 9;
    }

    function resetForm() {
      form.reset();
      riderIdInput.value = "";
      riderVersionInput.value = "";
      renderTeamOptions();
      formTitle.textContent = "新增车手";
      submitBtn.textContent = "添加";
      clearDraftBtn.hidden = false;
      draftHint.hidden = false;
      draftHint.textContent = "新增内容会自动保存为本地草稿";
    }

    function getRiderFormData() {
      return {
        rider_number: document.getElementById("rider-number").value.trim(),
        english_name: document.getElementById("english-name").value.trim(),
        chinese_name: document.getElementById("chinese-name").value.trim(),
        nickname: document.getElementById("nickname").value.trim(),
        nationality: document.getElementById("nationality").value.trim(),
        team_id: teamSelect.value || null,
        bike: document.getElementById("bike").value.trim(),
        birth_date: document.getElementById("birth-date").value,
        birth_place: document.getElementById("birth-place").value.trim(),
      };
    }

    function saveRiderDraftNow() {
      if (!isAdmin || riderIdInput.value) return;
      clearTimeout(draftSaveTimer);
      draftSaveTimer = null;
      try {
        const draft = getRiderFormData();
        if (!Object.values(draft).some(Boolean)) {
          localStorage.removeItem(RIDER_DRAFT_KEY);
          draftHint.textContent = "新增内容会自动保存为本地草稿";
          return;
        }
        localStorage.setItem(
          RIDER_DRAFT_KEY,
          JSON.stringify({ ...draft, saved_at: Date.now() })
        );
        draftHint.textContent = "草稿已自动保存";
      } catch (err) {
        draftHint.textContent = "当前浏览器无法保存草稿";
      }
    }

    function scheduleRiderDraftSave() {
      if (riderIdInput.value) return;
      clearTimeout(draftSaveTimer);
      draftHint.textContent = "正在保存草稿…";
      draftSaveTimer = setTimeout(saveRiderDraftNow, 300);
    }

    function clearRiderDraft() {
      clearTimeout(draftSaveTimer);
      draftSaveTimer = null;
      try {
        localStorage.removeItem(RIDER_DRAFT_KEY);
      } catch (err) {
        // 存储不可用时不影响已经成功提交的数据。
      }
    }

    function restoreRiderDraft() {
      try {
        const draft = JSON.parse(localStorage.getItem(RIDER_DRAFT_KEY) || "null");
        if (!draft) return false;
        document.getElementById("rider-number").value = draft.rider_number || "";
        document.getElementById("english-name").value = draft.english_name || "";
        document.getElementById("chinese-name").value = draft.chinese_name || "";
        document.getElementById("nickname").value = draft.nickname || "";
        document.getElementById("nationality").value = draft.nationality || "";
        renderTeamOptions(draft.team_id || "");
        document.getElementById("bike").value = draft.bike || "";
        document.getElementById("birth-date").value = draft.birth_date || "";
        document.getElementById("birth-place").value = draft.birth_place || "";
        draftHint.textContent = "已恢复上次未提交的草稿";
        return true;
      } catch (err) {
        try {
          localStorage.removeItem(RIDER_DRAFT_KEY);
        } catch (storageError) {
          // 忽略浏览器禁用本地存储的情况。
        }
        return false;
      }
    }

    function closeModal(preserveDraft = true) {
      if (preserveDraft && modal.open && !riderIdInput.value) saveRiderDraftNow();
      modal.close();
      resetForm();
      showToast(toast, "");
    }

    function openCreateModal() {
      resetForm();
      showToast(toast, "");
      restoreRiderDraft();
      modal.showModal();
      document.getElementById("rider-number").focus();
    }

    function renderTeamOptions(selectedId = "") {
      teamSelect.innerHTML =
        '<option value="">未分配</option>' +
        teams
          .map(
            (t) =>
              `<option value="${t.id}" ${String(t.id) === String(selectedId) ? "selected" : ""}>${escapeHtml(t.name)}</option>`
          )
          .join("");
    }

    async function loadTeams() {
      const result = await apiRequest("/api/teams");
      teams = result.data || [];
      renderTeamOptions();
      filterTeamSelect.innerHTML = '<option value="">全部车队</option>' + teams
        .map((t) => `<option value="${t.id}">${escapeHtml(t.name)}</option>`)
        .join("");
    }

    function renderRows(riders) {
      currentRiders = [...riders];
      const direction = sortDirection === "asc" ? 1 : -1;
      const sortedRiders = [...currentRiders].sort((a, b) => {
        const order = sortKey === "birth_date"
          ? String(a.birth_date || "").localeCompare(String(b.birth_date || ""))
          : riderNumberCollator.compare(
              String(a.rider_number || ""),
              String(b.rider_number || "")
            );
        return order ? order * direction : a.id - b.id;
      });

      ridersById = new Map(sortedRiders.map((rider) => [String(rider.id), rider]));
      if (!sortedRiders.length) {
        tbody.innerHTML = `<tr><td colspan="${colSpan()}" class="empty">暂无车手数据</td></tr>`;
        return;
      }

      tbody.innerHTML = sortedRiders
        .map((r) => {
          const ops = isAdmin
            ? `<td>
                <div class="row-actions">
                  <button type="button" class="btn-edit" data-edit-id="${r.id}">编辑</button>
                  <button type="button" class="btn-danger" data-id="${r.id}">删除</button>
                </div>
              </td>`
            : "";
          return `
            <tr>
              <td>${escapeHtml(r.rider_number)}</td>
              <td>${escapeHtml(r.english_name)}</td>
              <td>${escapeHtml(r.chinese_name)}</td>
              <td>${escapeHtml(r.nickname || "-")}</td>
              <td>${escapeHtml(r.nationality)}</td>
              <td>${escapeHtml(r.team_name || "-")}</td>
              <td>${escapeHtml(r.bike)}</td>
              <td>${escapeHtml(r.birth_date || "-")}</td>
              <td>${escapeHtml(r.birth_place)}</td>
              ${ops}
            </tr>`;
        })
        .join("");
    }

    function updateSortButtons() {
      document.querySelectorAll("[data-sort-key]").forEach((button) => {
        const active = button.dataset.sortKey === sortKey;
        button.classList.toggle("active", active);
        button.querySelector(".sort-indicator").textContent = active
          ? (sortDirection === "asc" ? "↑" : "↓")
          : "↕";
        button.setAttribute(
          "aria-label",
          `${button.dataset.sortKey === "rider_number" ? "车手编号" : "出生日期"}，${
            active ? (sortDirection === "asc" ? "当前升序，点击切换为降序" : "当前降序，点击切换为升序") : "点击按升序排列"
          }`
        );
      });
    }

    async function loadRiders() {
      try {
        const params = new URLSearchParams();
        const filters = {
          rider_number: document.getElementById("filter-rider-number").value.trim(),
          name: document.getElementById("filter-rider-name").value.trim(),
          nationality: document.getElementById("filter-nationality").value.trim(),
          team_id: filterTeamSelect.value,
        };
        Object.entries(filters).forEach(([key, value]) => value && params.set(key, value));
        const result = await apiRequest(`${API}${params.size ? `?${params}` : ""}`);
        renderRows(result.data || []);
      } catch (err) {
        if (err.status === 401) {
          navigateSitePage("/login.html");
          return;
        }
        tbody.innerHTML = `<tr><td colspan="${colSpan()}" class="empty">${escapeHtml(err.message)}</td></tr>`;
        showToast(listToast, err.message, true);
      }
    }

    async function init() {
      currentUser = await requireLogin();
      if (!currentUser) return;

      isAdmin = currentUser.role === "admin";
      document.getElementById("user-label").textContent = currentUser.username;
      document.getElementById("role-tag").textContent = isAdmin ? "超级管理员" : "普通用户";
      document.getElementById("page-desc").textContent = isAdmin
        ? "管理员可对车手信息进行增删改查"
        : "普通用户仅可查看车手信息";

      await loadTeams();
      if (isAdmin) {
        addBtn.hidden = false;
        document.getElementById("users-link").hidden = false;
        document.getElementById("logs-link").hidden = false;
      } else {
        opsTh.hidden = true;
      }

      await loadRiders();
    }

    document.getElementById("logout-btn").addEventListener("click", () => logout());

    document.querySelectorAll("[data-sort-key]").forEach((button) => {
      button.addEventListener("click", () => {
        const nextKey = button.dataset.sortKey;
        if (sortKey === nextKey) {
          sortDirection = sortDirection === "asc" ? "desc" : "asc";
        } else {
          sortKey = nextKey;
          sortDirection = "asc";
        }
        updateSortButtons();
        renderRows(currentRiders);
      });
    });

    updateSortButtons();

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!isAdmin) return;

      const payload = getRiderFormData();
      const id = riderIdInput.value;
      if (id) payload.version = Number(riderVersionInput.value);
      submitBtn.disabled = true;

      try {
        let successMessage;
        if (id) {
          await apiRequest(`${API}/${id}`, { method: "PUT", body: JSON.stringify(payload) });
          successMessage = "更新成功";
        } else {
          await apiRequest(API, { method: "POST", body: JSON.stringify(payload) });
          successMessage = "添加成功";
          clearRiderDraft();
        }
        await loadRiders();
        closeModal(false);
        showToast(listToast, successMessage);
      } catch (err) {
        if (err.status === 409) {
          await loadRiders();
          showToast(toast, `${err.message}，列表已刷新，请关闭窗口后重新编辑`, true);
        } else {
          showToast(toast, err.message, true);
        }
      } finally {
        submitBtn.disabled = false;
      }
    });

    addBtn.addEventListener("click", openCreateModal);
    document.getElementById("rider-filter-form").addEventListener("submit", (e) => {
      e.preventDefault();
      loadRiders();
    });
    document.getElementById("reset-filter-btn").addEventListener("click", () => {
      document.getElementById("rider-filter-form").reset();
      loadRiders();
    });
    form.addEventListener("input", scheduleRiderDraftSave);
    form.addEventListener("change", scheduleRiderDraftSave);
    clearDraftBtn.addEventListener("click", () => {
      if (!confirm("确认清空当前新增车手草稿吗？")) return;
      clearRiderDraft();
      resetForm();
      renderTeamOptions();
      showToast(toast, "草稿已清空");
      document.getElementById("rider-number").focus();
    });
    cancelBtn.addEventListener("click", () => closeModal());
    modalCloseBtn.addEventListener("click", () => closeModal());
    modal.addEventListener("click", (e) => {
      if (e.target === modal) closeModal();
    });
    modal.addEventListener("cancel", () => {
      if (!riderIdInput.value) saveRiderDraftNow();
      resetForm();
      showToast(toast, "");
    });

    tbody.addEventListener("click", async (e) => {
      if (!isAdmin) return;

      const editBtn = e.target.closest("[data-edit-id]");
      const delBtn = e.target.closest("[data-id]");

      if (editBtn) {
        const r = ridersById.get(editBtn.getAttribute("data-edit-id"));
        if (!r) return;
        riderIdInput.value = r.id;
        riderVersionInput.value = r.version;
        document.getElementById("rider-number").value = r.rider_number;
        document.getElementById("english-name").value = r.english_name;
        document.getElementById("chinese-name").value = r.chinese_name;
        document.getElementById("nickname").value = r.nickname || "";
        document.getElementById("nationality").value = r.nationality;
        renderTeamOptions(r.team_id || "");
        document.getElementById("bike").value = r.bike;
        document.getElementById("birth-date").value = r.birth_date || "";
        document.getElementById("birth-place").value = r.birth_place;
        formTitle.textContent = "编辑车手";
        submitBtn.textContent = "保存修改";
        clearDraftBtn.hidden = true;
        draftHint.hidden = true;
        showToast(toast, "");
        modal.showModal();
        return;
      }

      if (delBtn) {
        const id = delBtn.getAttribute("data-id");
        if (!confirm("确认删除该车手吗？")) return;
        try {
          await apiRequest(`${API}/${id}`, { method: "DELETE" });
          showToast(listToast, "删除成功");
          if (riderIdInput.value === id) resetForm();
          await loadRiders();
        } catch (err) {
          showToast(listToast, err.message, true);
        }
      }
    });

    init();
  </script>
</body>
</html>
