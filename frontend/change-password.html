<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>修改密码</title>
  <link rel="icon" type="image/jpeg" href="/assets/images/site-icon.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/common.css" />
</head>
<body>
  <div class="wrap">
    <header class="page-header">
      <div>
        <h1>修改<span>密码</span></h1>
        <p>定期更新登录密码，保护账号安全</p>
      </div>
      <div class="user-bar">
        <nav class="nav-links">
          <a href="/standings.html">车手积分</a>
          <a href="/calendar.html">赛程日历</a>
          <a href="/riders.html">车手信息</a>
          <a href="/teams.html">车队信息</a>
          <a href="/change-password.html" class="active">修改密码</a>
          <a href="/users.html" id="users-link" hidden>账号管理</a>
          <a href="/logs.html" id="logs-link" hidden>操作日志</a>
        </nav>
        <span id="user-label">加载中…</span>
        <span class="role-tag" id="role-tag"></span>
        <button type="button" class="btn-ghost" id="logout-btn">退出</button>
      </div>
    </header>

    <section class="panel password-panel">
      <h2>更新登录密码</h2>
      <p class="password-hint">新密码至少 6 位。修改成功后当前账号会自动退出，请使用新密码重新登录。</p>
      <form id="password-form">
        <div class="field">
          <label for="current-password">当前密码</label>
          <input id="current-password" type="password" maxlength="128" autocomplete="current-password" required />
        </div>
        <div class="field">
          <label for="new-password">新密码</label>
          <input id="new-password" type="password" minlength="6" maxlength="128" autocomplete="new-password" required />
        </div>
        <div class="field">
          <label for="confirm-password">确认新密码</label>
          <input id="confirm-password" type="password" minlength="6" maxlength="128" autocomplete="new-password" required />
        </div>
        <div class="actions">
          <button type="submit" class="btn-primary" id="submit-btn">确认修改</button>
        </div>
        <div class="toast" id="toast" role="status" aria-live="polite"></div>
      </form>
    </section>
  </div>

  <script src="/assets/js/api.js"></script>
  <script>
    async function initPasswordPage() {
      const currentUser = await requireLogin();
      if (!currentUser) return;

      document.getElementById("user-label").textContent = currentUser.username;
      document.getElementById("role-tag").textContent =
        currentUser.role === "admin" ? "超级管理员" : "普通用户";
      if (currentUser.role === "admin") {
        document.getElementById("users-link").hidden = false;
        document.getElementById("logs-link").hidden = false;
      }
    }

    document.getElementById("logout-btn").addEventListener("click", () => logout());

    document.getElementById("password-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const form = event.currentTarget;
      const currentPassword = document.getElementById("current-password").value;
      const newPassword = document.getElementById("new-password").value;
      const confirmPassword = document.getElementById("confirm-password").value;
      const submitButton = document.getElementById("submit-btn");
      const toast = document.getElementById("toast");

      toast.textContent = "";
      toast.classList.remove("error");
      if (newPassword !== confirmPassword) {
        toast.textContent = "两次输入的新密码不一致";
        toast.classList.add("error");
        return;
      }

      submitButton.disabled = true;
      try {
        const result = await apiRequest("/api/auth/password", {
          method: "PUT",
          body: JSON.stringify({
            current_password: currentPassword,
            new_password: newPassword,
          }),
        });
        form.reset();
        toast.textContent = result.message;
        clearTabAuthentication();
        setTimeout(() => navigateSitePage("/login.html"), 900);
      } catch (err) {
        toast.textContent = err.message;
        toast.classList.add("error");
        submitButton.disabled = false;
      }
    });

    initPasswordPage();
  </script>
</body>
</html>
